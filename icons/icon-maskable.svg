<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient - Full Bleed for Maskable Icons -->
    <linearGradient id="bgGradientMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Emerald / Success Gradient -->
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ambientOrb1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientOrb2" cx="70%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Receipt Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Full Bleed Square Background (no border radius) -->
  <rect width="512" height="512" fill="url(#bgGradientMask)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="140" r="150" fill="url(#ambientOrb1)"/>
  <circle cx="350" cy="370" r="160" fill="url(#ambientOrb2)"/>

  <!-- Center Card (Glass Backplate) within safe zone -->
  <rect x="106" y="96" width="300" height="320" rx="32" fill="url(#glassGradient)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2.5" filter="url(#cardShadow)"/>

  <!-- Shopping Bag / Bill Silhouette -->
  <!-- Top Handles / Flap -->
  <path d="M172 188 L198 126 L314 126 L340 188 Z" fill="none" stroke="url(#accentGradient)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bag Body -->
  <rect x="162" y="188" width="188" height="184" rx="18" fill="rgba(15, 23, 42, 0.7)" stroke="url(#accentGradient)" stroke-width="11" stroke-linejoin="round"/>

  <!-- Bag Handle Arc -->
  <path d="M218 230 C218 262 294 262 294 230" fill="none" stroke="url(#accentGradient)" stroke-width="11" stroke-linecap="round"/>

  <!-- Split Line / Slash (Symbolizing Bill Splitting) -->
  <line x1="146" y1="346" x2="366" y2="214" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10" filter="url(#glow)"/>

  <!-- Split People Badges / Coins -->
  <!-- User 1 (Left) -->
  <circle cx="168" cy="362" r="26" fill="url(#accentGradient)" stroke="#ffffff" stroke-width="3"/>
  <path d="M161 356 A6.5 6.5 0 1 1 174 356 A6.5 6.5 0 1 1 161 356 Z M153 375 C153 367 159 365 168 365 C177 365 183 367 183 375" fill="#ffffff"/>

  <!-- User 2 (Right) -->
  <circle cx="344" cy="198" r="26" fill="url(#emeraldGradient)" stroke="#ffffff" stroke-width="3"/>
  <path d="M337 192 A6.5 6.5 0 1 1 350 192 A6.5 6.5 0 1 1 337 192 Z M329 211 C329 203 335 201 344 201 C353 201 359 203 359 211" fill="#ffffff"/>

  <!-- Sparkle Accent in Center-Right -->
  <path d="M318 322 Q327 322 327 313 Q327 322 336 322 Q327 322 327 331 Q327 322 318 322 Z" fill="#38bdf8" filter="url(#glow)"/>
</svg>
